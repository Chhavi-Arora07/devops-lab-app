apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-text=GitOps v2", "-listen=:5678"]
          ports:
            - containerPort: 5678